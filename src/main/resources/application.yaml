server:
  port: 8083

spring:
  application:
    name: orders-metrics-exporter
  web:
    error:
      include-message: always
      include-exception: true
      include-binding-errors: always

springdoc:
  swagger-ui:
    enabled: true
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    root: INFO
    ru.rgrabelnikov.ordersmetricsexporter: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    prometheus:
      access: read_only
  prometheus:
    metrics:
      export:
        enabled: true

integration:
  orders-api:
    stats-url: ${ORDERS_API_INTERNAL_STATS_URL:http://localhost:8081/internal/stats}
